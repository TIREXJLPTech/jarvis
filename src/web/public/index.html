<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JLP</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #262a33;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header button {
    background: none;
    border: 1px solid #3a3f4b;
    color: #9aa0ab;
    border-radius: 6px;
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    font-size: 0.8rem;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .msg { max-width: 75%; padding: 0.5rem 0.75rem; border-radius: 10px; white-space: pre-wrap; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: #2563eb; color: white; }
  .msg.assistant { align-self: flex-start; background: #1c1f26; border: 1px solid #262a33; }
  .msg.system { align-self: center; color: #9aa0ab; font-size: 0.85rem; }
  form { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid #262a33; }
  input[type="text"], input[type="password"] {
    flex: 1;
    background: #1c1f26;
    border: 1px solid #3a3f4b;
    color: #e6e6e6;
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
  }
  button[type="submit"] {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    font-size: 1rem;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #gate {
    position: fixed;
    inset: 0;
    background: rgba(15, 17, 21, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #gate.hidden { display: none; }
  .gate-box {
    background: #1c1f26;
    border: 1px solid #262a33;
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .gate-box p { margin: 0 0 1rem; color: #9aa0ab; font-size: 0.9rem; }
  .gate-box form { border: none; padding: 0; flex-direction: column; }
  .gate-box input { margin-bottom: 0.75rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>JLP</h1>
  <button id="reset">Reiniciar conversa</button>
</header>
<div id="log"></div>
<form id="form">
  <input type="text" id="input" autocomplete="off" placeholder="Fala com o JLP..." />
  <button type="submit">Enviar</button>
</form>

<div id="gate" class="hidden">
  <div class="gate-box">
    <p>Token de acesso do JLP</p>
    <form id="gate-form">
      <input type="password" id="gate-input" autocomplete="off" placeholder="Cole o token aqui" />
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const resetBtn = document.getElementById('reset');
  const gate = document.getElementById('gate');
  const gateForm = document.getElementById('gate-form');
  const gateInput = document.getElementById('gate-input');

  function getOrCreate(key, factory) {
    let value = localStorage.getItem(key);
    if (!value) {
      value = factory();
      localStorage.setItem(key, value);
    }
    return value;
  }

  const clientId = getOrCreate('jlpClientId', () => crypto.randomUUID());
  let token = localStorage.getItem('jlpToken');
  let tokenWaiters = [];

  function addMessage(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function ensureToken() {
    if (token) return Promise.resolve();
    gate.classList.remove('hidden');
    gateInput.focus();
    return new Promise((resolve) => tokenWaiters.push(resolve));
  }

  gateForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = gateInput.value.trim();
    if (!value) return;

    token = value;
    localStorage.setItem('jlpToken', token);
    gateInput.value = '';
    gate.classList.add('hidden');

    tokenWaiters.forEach((resolve) => resolve());
    tokenWaiters = [];
  });

  async function callApi(path, body) {
    const resp = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-jlp-token': token },
      body: JSON.stringify(body),
    });
    if (resp.status === 401) {
      localStorage.removeItem('jlpToken');
      token = null;
      await ensureToken();
      return callApi(path, body);
    }
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Erro desconhecido.');
    return data;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    await ensureToken();
    addMessage('user', message);
    input.value = '';
    input.disabled = true;

    try {
      const data = await callApi('/api/chat', { message, clientId });
      addMessage('assistant', data.text);
    } catch (err) {
      addMessage('system', 'Erro: ' + err.message);
    } finally {
      input.disabled = false;
      input.focus();
    }
  });

  resetBtn.addEventListener('click', async () => {
    await ensureToken();
    try {
      await callApi('/api/reset', { clientId });
      log.innerHTML = '';
      addMessage('system', 'Memória desta conversa reiniciada.');
    } catch (err) {
      addMessage('system', 'Erro: ' + err.message);
    }
  });

  ensureToken().then(() => addMessage('system', 'JLP operacional. Pode falar.'));
</script>
</body>
</html>
